# docker-compose.local.yml — TEST LOCAL UNIQUEMENT

services:

  # ─── MySQL ───────────────────────────────────────────
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "3306:3306"       # accès direct depuis DBeaver/TablePlus
    networks:
      - ismp_local
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost",
             "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─── phpMyAdmin ──────────────────────────────────────
  phpmyadmin:
    image: phpmyadmin:latest
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_USER: ${MYSQL_USER}
      PMA_PASSWORD: ${MYSQL_PASSWORD}
      UPLOAD_LIMIT: 64M
    ports:
      - "8080:80"         # → http://localhost:8080
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - ismp_local

  # ─── Backend PHP ─────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_TEMP: ${DB_TEMP}
      DB_PROD: ${DB_PROD}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "8082:80"         # → http://localhost:8082
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - ismp_local
    volumes:
      # Hot-reload : vos fichiers PHP se rechargent sans rebuild
      - ./backend:/var/www/html

  # ─── Frontend React ──────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: http://localhost:8082
    restart: unless-stopped
    ports:
      - "4000:80"         # → http://localhost:4000
    depends_on:
      - backend
    networks:
      - ismp_local

networks:
  ismp_local:
    driver: bridge

volumes:
  mysql_data: